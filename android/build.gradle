buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            force 'com.android.tools.build:gradle:9.0.1'
            force 'com.android.tools.build:builder:9.0.1'
            force 'com.android.tools.build:bundletool:1.18.3'
        }
    }

    dependencies {
        // START: FlutterFire Configuration
        classpath 'com.google.gms:google-services:4.4.2'
        // END: FlutterFire Configuration
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp' }
        maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/common' }
    }
    
    configurations.all {
        resolutionStrategy {
            force 'com.android.tools.build:gradle:9.0.1'
            force 'androidx.concurrent:concurrent-futures:1.2.0'
        }
    }
}

rootProject.buildDir = '../build'

// Keep plugins (including :jni) on the same NDK as the app / Flutter default.
// package:jni 1.0.0 hardcodes 27.0.12077973, which AGP will try to use even
// when the app pins a newer NDK.
def flutterNdkVersion = "28.2.13676358"

// Define Flutter properties for subprojects that expect them.
def flutterProperties = [
    compileSdkVersion: 36,
    minSdkVersion    : 24,
    targetSdkVersion : 36,
    ndkVersion       : flutterNdkVersion
]

rootProject.ext.flutter = flutterProperties

// Make the flutter properties available to every project as early as possible.
gradle.beforeProject { proj ->
    proj.ext.flutter = flutterProperties
    
    // Force AGP version for plugin buildscripts as early as possible
    try {
        proj.buildscript.configurations.all {
            resolutionStrategy {
                force 'com.android.tools.build:gradle:9.0.1'
                force 'com.android.tools.build:builder:9.0.1'
                force 'com.android.tools.build:bundletool:1.18.3'
            }
        }
    } catch (ignored) {
        // Some projects might not have buildscript yet
    }
}

gradle.allprojects { proj ->
    // Force AGP version for all projects including plugins
    proj.buildscript.configurations.all {
        resolutionStrategy {
            force 'com.android.tools.build:gradle:9.0.1'
            force 'com.android.tools.build:builder:9.0.1'
            force 'com.android.tools.build:bundletool:1.18.3'
        }
    }
    
    // Provide an android.flutter getter as soon as the Android plugin is applied.
    def attachFlutterExtension = {
        def androidExt = proj.extensions.findByName('android')
        if (androidExt != null) {
            if (!androidExt.metaClass.respondsTo(androidExt, "getFlutter")) {
                androidExt.metaClass.getFlutter = { -> flutterProperties }
            }

            // Ensure sane defaults if the plugin forgot to set them.
            try {
                if (androidExt.compileSdkVersion == null || androidExt.compileSdkVersion.toString() == 'null') {
                    androidExt.compileSdkVersion flutterProperties.compileSdkVersion
                }
            } catch (ignored) {
                try {
                    androidExt.compileSdkVersion flutterProperties.compileSdkVersion
                } catch (allIgnored) {}
            }

            try {
                if (androidExt.defaultConfig?.minSdkVersion == null) {
                    androidExt.defaultConfig.minSdkVersion flutterProperties.minSdkVersion
                }
            } catch (ignored) {}

            try {
                androidExt.ndkVersion = flutterNdkVersion
            } catch (ignored) {}
        }
    }

    proj.plugins.withId('com.android.application') { attachFlutterExtension.call() }
    proj.plugins.withId('com.android.library') { attachFlutterExtension.call() }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    // Force all subprojects to use the newer AGP version and Java 17
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                ndkVersion = flutterNdkVersion
                compileSdkVersion 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            project.configurations.all {
                resolutionStrategy {
                    force 'com.android.tools.build:gradle:9.0.1'
                    force 'com.android.tools.build:builder:9.0.1'
                    force 'com.android.tools.build:bundletool:1.18.3'
                    force 'androidx.concurrent:concurrent-futures:1.2.0'
                }
            }
            // Ensure CameraX / ML Kit plugin modules can resolve Futures adapters.
            project.dependencies {
                add('implementation', 'androidx.concurrent:concurrent-futures:1.2.0')
            }
        }
        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
